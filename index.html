<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasowy Typer Egzaminacyjny</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --primary-color: #8E2DE2;
            --secondary-color: #4A00E0;
            --background-start: #1e132b;
            --background-end: #0c0514;
            --surface-color: rgba(255, 255, 255, 0.07);
            --surface-hover: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #f0f0f0;
            --accent-color: #00e5ff;
            --success-color: #2eff7b;
            --danger-color: #ff4d4d;
            --admin-color: #ff8c00;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--background-start), var(--background-end));
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--background-start);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.7s ease-out forwards;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 { font-size: 2em; font-weight: 700; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        .header-info { display: flex; align-items: center; gap: 15px; }
        #admin-indicator {
            background-color: var(--admin-color);
            padding: 5px 12px; border-radius: 20px; font-weight: 600;
            font-size: 0.9em; display: none; box-shadow: 0 0 10px var(--admin-color);
        }
        #user-balance {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            padding: 8px 16px; border-radius: 20px; font-weight: 600;
            font-size: 1.1em; box-shadow: 0 0 15px rgba(142, 45, 226, 0.7);
        }
        
        #admin-panel {
            background: var(--surface-hover); padding: 20px;
            border-radius: 10px; margin-bottom: 25px; display: none;
            animation: fadeIn 0.5s ease; border: 1px solid var(--glass-border);
        }
        #admin-panel h2 { margin-bottom: 15px; text-align: center; color: var(--admin-color); }
        .form-container { display: flex; gap: 10px; }

        .input-field {
            flex-grow: 1; padding: 12px; border: 1px solid transparent;
            background-color: rgba(0, 0, 0, 0.3); border-radius: 8px; font-size: 16px;
            color: var(--text-color); transition: border-color 0.3s ease;
        }
        .input-field::placeholder { color: rgba(255, 255, 255, 0.5); }
        .input-field:focus { outline: none; border-color: var(--accent-color); }
        
        .btn {
            padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 16px; font-weight: 600; transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background-color: var(--accent-color); color: #1a1a2e; }
        .btn-primary:hover { filter: brightness(1.1); box-shadow: 0 5px 15px rgba(0, 229, 255, 0.4); }

        .student-list { list-style: none; }
        .empty-list-message {
            text-align: center; padding: 40px; background: var(--surface-color);
            border-radius: 10px; border: 1px solid var(--glass-border);
            opacity: 0; animation: fadeIn 1s 0.5s ease forwards;
        }
        .empty-list-message svg { width: 50px; height: 50px; margin-bottom: 15px; opacity: 0.7; }

        .student-item {
            background: var(--surface-color); border-radius: 10px; margin-bottom: 15px;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            border-left: 5px solid gray;
            transition: transform 0.3s ease, background-color 0.3s ease, border-left-color 0.3s ease;
            opacity: 0; transform: translateX(-20px);
        }
        .student-item.visible { opacity: 1; transform: translateX(0); }
        .student-item:hover { background-color: var(--surface-hover); transform: translateY(-3px); }
        .student-item.status-zda { border-left-color: var(--success-color); }
        .student-item.status-nie-zda { border-left-color: var(--danger-color); }

        .student-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .student-name { font-size: 1.4em; font-weight: 600; }

        .status-badge {
            padding: 6px 12px; border-radius: 20px; font-size: 0.9em; font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .status-badge.result-pass { background: var(--success-color); color: #111; }
        .status-badge.result-fail { background: var(--danger-color); color: #fff; }
        .status-badge.bet-pending { background: var(--accent-color); color: #111; }
        .status-badge.bet-won { background: linear-gradient(45deg, #00b09b, var(--success-color)); color: #111; }
        .status-badge.bet-lost { background: linear-gradient(45deg, #ff512f, var(--danger-color)); color: #fff; }
        .status-badge.bet-open { background-color: #777; color: #fff; }

        .actions-container { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

        .betting-controls { display: flex; gap: 10px; align-items: center; }
        .bet-input {
            width: 80px; padding: 8px; text-align: center; background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border); color: var(--text-color); border-radius: 5px;
        }

        .bet-btn { padding: 8px 12px; font-size: 14px; border-radius: 5px; }
        .btn-pass { background-color: var(--success-color); color: #111; }
        .btn-fail { background-color: var(--danger-color); color: #fff; }
        .btn-pass:hover { filter: brightness(1.1); }
        .btn-fail:hover { filter: brightness(1.1); }

        .admin-controls { display: flex; gap: 10px; }
        .admin-btn { background-color: transparent; border: 1px solid #777; color: #aaa; padding: 8px 12px; font-size: 14px; }
        .admin-btn:hover { background-color: #777; color: #fff; }
        
        footer {
            text-align: center; margin-top: 30px; font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5); border-top: 1px solid var(--glass-border);
            padding-top: 20px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            .student-info, .actions-container { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="preloader"><div class="spinner"></div></div>

    <div class="container">
        <header>
            <h1>Klasowy Typer 🏆</h1>
            <div class="header-info">
                <span id="admin-indicator"></span>
                <div id="user-balance"></div>
            </div>
        </header>

        <div id="admin-panel">
            <h2>Panel Administratora</h2>
            <div class="form-container">
                <input type="text" id="student-name-input" class="input-field" placeholder="Imię i nazwisko nowego ucznia...">
                <button id="add-student-button" class="btn btn-primary">Dodaj</button>
            </div>
        </div>

        <ul id="student-list" class="student-list"></ul>
        
        <footer>
            Stworzone z pasją. Powodzenia na egzaminie!
        </footer>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // =================================================================================
    // === KONFIGURACJA ===
    // BARDZO WAŻNE: ZMIEŃ 'admin123' NA SWÓJ WŁASNY, TAJNY KLUCZ!
    const ADMIN_KEY = 'admin123';
    // =================================================================================
    const STARTING_BALANCE = 1000;
    const PAYOUT_MULTIPLIER = 2;
    const STORAGE_KEYS = {
        STUDENTS: 'classExamStudents_v4',
        BETS: 'classExamUserBets_v4',
        BALANCE: 'classExamUserBalance_v4'
    };

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => document.querySelectorAll(selector);

    const studentNameInput = $('#student-name-input');
    const adminPanel = $('#admin-panel');
    const studentListContainer = $('#student-list');

    let students = [];
    let userBets = {};
    let userBalance = STARTING_BALANCE;
    let isAdmin = false;

    // === GŁÓWNA LOGIKA ===
    
    const loadState = () => {
        students = JSON.parse(localStorage.getItem(STORAGE_KEYS.STUDENTS)) || [];
        userBets = JSON.parse(localStorage.getItem(STORAGE_KEYS.BETS)) || {};
        const storedBalance = localStorage.getItem(STORAGE_KEYS.BALANCE);
        userBalance = storedBalance !== null ? parseFloat(storedBalance) : STARTING_BALANCE;
    };
    
    const saveState = () => {
        // !! WAŻNA POPRAWKA: Studentów zapisuje każdy, aby lista była widoczna.
        // Tylko admin może ją modyfikować poprzez UI.
        localStorage.setItem(STORAGE_KEYS.STUDENTS, JSON.stringify(students));
        localStorage.setItem(STORAGE_KEYS.BETS, JSON.stringify(userBets));
        localStorage.setItem(STORAGE_KEYS.BALANCE, userBalance.toString());
    };

    const initAdminMode = () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('key') === ADMIN_KEY) {
            isAdmin = true;
            adminPanel.style.display = 'block';
            $('#admin-indicator').textContent = '👑 Tryb Admina';
            $('#admin-indicator').style.display = 'inline-block';
        }
    };
    
    const checkResolvedBets = () => {
        let balanceChanged = false;
        students.forEach(student => {
            const bet = userBets[student.id];
            if (bet && !bet.paid && student.status.startsWith('Wynik')) {
                const officialResult = student.status.includes('Zdał') ? 'Zda' : 'Nie zda';
                if (bet.choice === officialResult) {
                    userBalance += bet.amount * PAYOUT_MULTIPLIER;
                    bet.status = 'won';
                } else {
                    bet.status = 'lost';
                }
                bet.paid = true;
                balanceChanged = true;
            }
        });

        if (balanceChanged) saveState();
    };

    // === RENDEROWANIE INTERFEJSU ===
    const render = () => {
        $('#user-balance').innerHTML = `Saldo: ${Math.round(userBalance)} 🪙`;
        studentListContainer.innerHTML = '';

        if (students.length === 0) {
            studentListContainer.innerHTML = `<li class="empty-list-message">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path></svg>
                <h3>Lista jest pusta</h3><p>Administrator musi dodać uczniów, aby rozpocząć typowanie.</p></li>`;
            return;
        }

        students.forEach(student => {
            const userBet = userBets[student.id];
            
            let itemStatusClass = '';
            if (student.status.startsWith('Wynik: Zdał')) itemStatusClass = 'status-zda';
            if (student.status.startsWith('Wynik: Nie zdał')) itemStatusClass = 'status-nie-zda';

            let statusHTML = '';
            if (student.status.startsWith('Wynik')) {
                const resultClass = student.status.includes('Zdał') ? 'result-pass' : 'result-fail';
                statusHTML = `<span class="status-badge ${resultClass}">${student.status}</span>`;
            } else if (userBet) {
                let betClass = 'bet-pending', betText = `Obstawiono: ${userBet.amount} na "${userBet.choice}"`;
                if(userBet.status === 'won') { betClass = 'bet-won'; betText = `Wygrana! +${userBet.amount * PAYOUT_MULTIPLIER} 🪙`; } 
                else if (userBet.status === 'lost') { betClass = 'bet-lost'; betText = `Przegrana -${userBet.amount} 🪙`; }
                statusHTML = `<span class="status-badge ${betClass}">${betText}</span>`;
            } else {
                statusHTML = `<span class="status-badge bet-open">Otwarty do obstawiania</span>`;
            }

            const isResolved = student.status.startsWith('Wynik');
            const userActions = !userBet && !isResolved ? `
                <div class="betting-controls">
                    <input type="number" class="bet-input" placeholder="Stawka" min="1" step="1" id="bet-amount-${student.id}">
                    <button class="btn bet-btn btn-pass" data-action="bet-pass" data-id="${student.id}">Obstaw Zda</button>
                    <button class="btn bet-btn btn-fail" data-action="bet-fail" data-id="${student.id}">Obstaw Nie Zda</button>
                </div>` : '';
            
            const adminActions = isAdmin ? `
                <div class="admin-controls">
                    ${!isResolved ? `
                    <button class="btn admin-btn" data-action="resolve-pass" data-id="${student.id}">✔️ Rozstrzygnij: Zdał</button>
                    <button class="btn admin-btn" data-action="resolve-fail" data-id="${student.id}">❌ Rozstrzygnij: Nie zdał</button>` : ''}
                    <button class="btn admin-btn" data-action="delete-student" data-id="${student.id}">🗑️ Usuń</button>
                </div>` : '';

            const li = document.createElement('li');
            li.className = `student-item ${itemStatusClass}`;
            li.innerHTML = `
                <div class="student-info"><span class="student-name">${student.name}</span>${statusHTML}</div>
                <div class="actions-container">${userActions}${adminActions}</div>`;
            studentListContainer.appendChild(li);
        });

        // Animowane pojawianie się listy
        $$('.student-item').forEach((item, index) => {
            setTimeout(() => { item.classList.add('visible'); }, (index + 1) * 80);
        });
    };

    // === AKCJE UŻYTKOWNIKA ===
    const handleAddStudent = () => {
        if (!isAdmin) return;
        const name = studentNameInput.value.trim();
        if (name === '') { alert('Wpisz imię i nazwisko ucznia!'); return; }
        students.push({ id: Date.now(), name, status: 'Nieobstawione' });
        studentNameInput.value = '';
        saveState();
        render();
    };

    const placeBet = (studentId, choice) => {
        const amountInput = $(`#bet-amount-${studentId}`);
        const amount = parseFloat(amountInput.value);

        if (isNaN(amount) || amount <= 0) { alert('Podaj poprawną, dodatnią stawkę.'); return; }
        if (amount > userBalance) { alert('Nie masz wystarczających środków!'); return; }
        if (userBets[studentId]) { alert('Już obstawiłeś wynik dla tego ucznia!'); return; }

        userBalance -= amount;
        userBets[studentId] = { choice, amount, paid: false };
        saveState();
        render();
    };
    
    const resolveStudent = (studentId, result) => {
        if (!isAdmin) return;
        const student = students.find(s => s.id === studentId);
        if (student && confirm(`Jesteś pewien, że chcesz oznaczyć wynik dla "${student.name}" jako "${result}"?\nTa operacja jest nieodwracalna.`)) {
            student.status = result;
            saveState();
            checkResolvedBets();
            render();
        }
    };

    const deleteStudent = (studentId) => {
        if (!isAdmin) return;
        const student = students.find(s => s.id === studentId);
        if (student && confirm(`Na pewno usunąć "${student.name}"?\nWszystkie zakłady dotyczące tej osoby zostaną anulowane.`)) {
            students = students.filter(s => s.id !== studentId);
            delete userBets[studentId];
            saveState();
            render();
        }
    };

    // === INICJALIZACJA APLIKACJI ===
    function init() {
        initAdminMode();
        loadState();
        checkResolvedBets();
        render();

        // Ukryj preloader po załadowaniu
        const preloader = $('.preloader');
        preloader.style.opacity = '0';
        setTimeout(() => preloader.style.display = 'none', 500);

        // Ustaw event listenery
        if (isAdmin) {
            $('#add-student-button').addEventListener('click', handleAddStudent);
            studentNameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddStudent();
            });
        }

        studentListContainer.addEventListener('click', (e) => {
            const target = e.target.closest('button');
            if (!target) return;
            const action = target.dataset.action;
            const id = parseInt(target.dataset.id);
            if (!action || !id) return;

            const actions = {
                'bet-pass': () => placeBet(id, 'Zda'),
                'bet-fail': () => placeBet(id, 'Nie zda'),
                'resolve-pass': () => resolveStudent(id, 'Wynik: Zdał'),
                'resolve-fail': () => resolveStudent(id, 'Wynik: Nie zdał'),
                'delete-student': () => deleteStudent(id)
            };
            
            if (actions[action]) actions[action]();
        });
    }

    init();
});
</script>

</body>
</html>
